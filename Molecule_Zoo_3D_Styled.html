.orb i{position:absolute;top:14px;width:9px;height:9px;border-radius:50%;background:#fff;box-shadow:inset -2px -2px 0 #0B1020}.orb i:first-child{left:9px}.orb i:last-child{right:9px}
@keyframes bob{50%{transform:translateY(-4px)}}@media(prefers-reduced-motion:reduce){.orb{animation:none}}
#zc{position:fixed;left:72px;top:140px;max-width:min(300px,calc(100vw - 90px));z-index:5;background:var(--panel);backdrop-filter:blur(6px);border:1px solid rgba(77,242,192,.35);border-radius:16px;padding:12px}
#hero h1{margin:18px 0 6px}

.spin b{position:absolute;inset:26px;border-radius:50%;background:var(--mint);box-shadow:0 0 26px var(--mint);animation:pulse 1.4s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{50%{transform:scale(.7);opacity:.6}}
@media(prefers-reduced-motion:reduce){.spin{animation-duration:3s}.spin b{animation:none}}
#hero{transition:opacity .4s}
#tut{position:fixed;inset:0;z-index:9;pointer-events:none}#tut[hidden]{display:none}
#sp{position:fixed;border-radius:16px;box-shadow:0 0 0 9999px rgba(5,8,18,.72),0 0 0 3px var(--mint),0 0 24px var(--mint);pointer-events:none;transition:all .35s}
#tc{position:fixed;left:12px;right:12px;max-width:430px;margin:0 auto;background:rgba(14,19,40,.98);border:1px solid var(--mint);border-radius:18px;padding:14px;pointer-events:auto;box-shadow:0 10px 40px rgba(0,0,0,.5)}
#tc small{color:var(--mint);font:12px var(--mono);letter-spacing:2px}#tc b{display:block;font:600 22px var(--head);margin:4px 0}#tc p{margin:0 0 10px;color:var(--text)}
.tr{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}.tr button{min-height:40px;padding:6px 16px}.tr button[hidden]{display:none}
#rail{background:rgba(14,19,40,.6);border:1px solid rgba(77,242,192,.25);border-radius:16px;scrollbar-width:none;align-items:center;width:64px;top:150px}#rail::-webkit-scrollbar{display:none}
.rt{font:600 11px var(--mono);color:var(--mint);text-align:center;letter-spacing:2px;flex:0 0 auto}.rt small{color:var(--dim);letter-spacing:0;font-size:9px}
.zi{display:flex;flex-direction:column;align-items:center;gap:2px;flex:0 0 auto}.zi small{font-size:9px;color:var(--dim);max-width:56px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#zc{top:150px}
#hb{min-width:44px;padding:10px}

#rail{width:112px;top:120px;bottom:250px;gap:14px;padding:10px 6px}
.rt{font-size:14px}.rt small{font-size:11px}
.orb{background:none;border:none;width:50px;height:50px}.orb svg{display:block}
.zi small{font-size:12px;max-width:100px;white-space:normal;text-align:center;line-height:1.15;color:var(--text)}

.zh{display:flex;align-items:center;gap:12px}.zh>div{flex:1}.zn{font:600 24px var(--head)}.zh small{display:block;color:var(--dim);font:12px var(--mono)}.zh button{min-height:36px;padding:4px 12px}
#zc h4{margin:14px 0 6px;color:var(--mint);font:600 12px var(--mono);letter-spacing:2px;text-transform:uppercase}#zc p{margin:0 0 10px}
.svw{background:rgba(255,255,255,.04);border-radius:14px;padding:6px}.sv{width:100%;height:auto;display:block}.dm{color:var(--dim)}
.it{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:10px}.it th{text-align:left;color:var(--dim);font-weight:500;padding:6px 8px 6px 0;width:34%;vertical-align:top}.it td{padding:6px 0}.it tr{border-bottom:1px solid rgba(255,255,255,.07)}
button i.fa-solid{margin-right:4px}#shelf button i,.rh button i,.zh button i,#vx i{margin:0}
.qw{max-width:760px;margin:0 auto}.qh{display:flex;justify-content:space-between;align-items:center;font:600 26px var(--head);margin-bottom:10px}#vx[hidden]{display:none}
.qd,.qc p{color:var(--dim)}.qg{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin:12px 0}
.qc{background:var(--panel);border:1px solid rgba(77,242,192,.25);border-radius:18px;padding:14px}.qc h3{font:600 20px var(--head);margin:0 0 6px}.qn{display:flex;gap:6px;margin:8px 0}
.qt{display:flex;justify-content:space-between;align-items:center;font:600 15px var(--mono);margin-bottom:8px}.tm{font:600 36px var(--head);color:var(--mint)}.tm.dg{color:var(--coral);animation:blink .6s infinite alternate}

.pb{height:8px;background:rgba(255,255,255,.08);border-radius:9px;overflow:hidden;margin-bottom:16px}.pb i{display:block;height:100%;width:0;background:var(--mint);transition:width .3s}
.qq{font:500 21px/1.4 var(--head);margin:0 0 14px}

.qo.ok{background:rgba(77,242,192,.22);border-color:var(--mint);opacity:1}.qo.bad{background:rgba(255,92,112,.22);border-color:var(--coral);opacity:1}

/* ===== Refinement: fixed lab stage + quiz visual system ===== */
#c{z-index:0}
#hud{z-index:2}
#dock{z-index:3}
#rail{z-index:4}
#zc{z-index:5}
#rack,#cat,#vial{z-index:20}
#tut{z-index:30}
#toast{z-index:25}
#dock button,#dock label{position:relative;transform:none!important}
#dock button:active{transform:none!important}
#vial{background:
 radial-gradient(ellipse at 12% 5%,rgba(77,242,192,.12),transparent 34%),
 radial-gradient(ellipse at 88% 90%,rgba(110,200,255,.10),transparent 38%),
 #0B1020}
#vial .qw{max-width:900px}
#vial .qh{position:sticky;top:calc(-16px - env(safe-area-inset-top,0px));z-index:3;padding:12px 0 14px;background:linear-gradient(#0B1020 72%,transparent);backdrop-filter:blur(12px)}
#vial .qh>span{display:flex;align-items:center;gap:10px}
#vial .qh>span>i{display:grid;place-items:center;width:42px;height:42px;border-radius:14px;color:var(--mint);background:rgba(77,242,192,.12);border:1px solid rgba(77,242,192,.28)}
.qintro{display:flex;align-items:center;gap:14px;padding:16px;border:1px solid rgba(77,242,192,.2);border-radius:20px;background:linear-gradient(120deg,rgba(77,242,192,.1),rgba(110,200,255,.055));margin:8px 0 18px}
.qintro .qseal{width:58px;height:58px;flex:0 0 58px;border-radius:18px;display:grid;place-items:center;background:rgba(77,242,192,.12);color:var(--mint);font-size:27px}
.qintro p{margin:3px 0 0;color:var(--dim);font-size:13px}
.qmode{position:relative;overflow:hidden;min-height:230px;display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.qmode:after{content:"";position:absolute;width:150px;height:150px;border:1px solid rgba(77,242,192,.12);border-radius:50%;right:-42px;top:-52px;box-shadow:0 0 0 18px rgba(77,242,192,.025),0 0 0 38px rgba(77,242,192,.02);pointer-events:none}
.qmode.timed{border-color:rgba(255,92,112,.32);background:linear-gradient(145deg,rgba(255,92,112,.13),rgba(30,39,71,.88) 55%)}
.qmode.relaxed{border-color:rgba(110,200,255,.3);background:linear-gradient(145deg,rgba(110,200,255,.12),rgba(30,39,71,.88) 55%)}
.qmode h3{display:flex;align-items:center;gap:9px}
.qmode h3 i{color:var(--mint)}
.qmode.timed h3 i{color:var(--coral)}
.qmode .qtag{font:11px var(--mono);letter-spacing:1.4px;color:var(--dim);text-transform:uppercase}
.qmode .qn{margin:auto 0 2px}
.qmode .go{margin-top:6px;min-width:150px}
.qrecord{margin-top:18px;padding:16px;border:1px solid rgba(255,184,77,.2);border-radius:18px;background:rgba(255,184,77,.045)}
.qrecord h3{font:600 19px var(--head);margin:0 0 8px;color:var(--amber)}
.qrecord .it{margin:0}
.qrecord .it tr:last-child{border:0}
.qplayhead{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:rgba(30,39,71,.85);border:1px solid rgba(77,242,192,.2);margin-bottom:14px}
.qplayhead .qcount{font:12px var(--mono);color:var(--dim)}
.qplayhead .tm{font-size:38px;line-height:1}
.qstreak{font:600 14px var(--mono);color:var(--amber);white-space:nowrap}
.qquestion{position:relative;overflow:hidden;padding:clamp(18px,4vw,30px);border-radius:22px;border:1px solid rgba(77,242,192,.28);background:radial-gradient(circle at 100% 0,rgba(77,242,192,.11),transparent 40%),linear-gradient(135deg,rgba(30,39,71,.96),rgba(15,24,47,.96));box-shadow:0 16px 50px rgba(0,0,0,.22)}
.qquestion:before{content:"MOLECULE IDENTIFICATION";display:block;color:var(--mint);font:11px var(--mono);letter-spacing:2px;margin-bottom:14px}
.qquestion .qq{max-width:760px;font-size:clamp(21px,3vw,28px);margin:0 0 22px}
.qos{grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:10px}
.qo{min-height:60px;border:1px solid rgba(182,192,224,.18);background:rgba(30,39,71,.78);transition:background .18s,border-color .18s}
.qo:hover:not(:disabled){transform:translateY(-1px);background:rgba(77,242,192,.08)}
.qo b{width:34px;height:34px;color:var(--mint);background:rgba(77,242,192,.12);border:1px solid rgba(77,242,192,.2)}

.qo.ok b{background:var(--mint);color:#06281f}
.qo.bad b{background:var(--coral);color:#260910}
.qfbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:16px}
.qfbar .fb{flex:1;margin:0}
.qwarn{padding:10px;border:1px solid rgba(255,92,112,.5);border-radius:12px;background:rgba(255,92,112,.12)}
.qresult{padding:clamp(18px,4vw,30px);border-radius:22px;border:1px solid rgba(77,242,192,.25);background:radial-gradient(circle at 100% 0,rgba(77,242,192,.12),transparent 42%),var(--panel)}
.qresult h2{font:600 clamp(28px,5vw,40px) var(--head)}
.qresult .rg div{border:1px solid rgba(182,192,224,.12);background:rgba(11,16,32,.42)}
.qresult .rg b{font-size:clamp(30px,5vw,42px)}
.qresult .qn{flex-wrap:wrap}
.qx{border-color:rgba(255,92,112,.28);color:#ffc0c8}
@media(max-width:560px){#vial{padding-left:12px;padding-right:12px}.qintro{align-items:flex-start}.qintro .qseal{width:46px;height:46px;flex-basis:46px}.qplayhead{flex-wrap:wrap}.qmode{min-height:210px}}



/* ===== Unified Molecule Zoo interface: match the quiz visual language ===== */
:root{
 --panel:rgba(25,35,65,.88);
 --panel-strong:rgba(17,26,51,.96);
 --line:rgba(77,242,192,.22);
 --line-soft:rgba(182,192,224,.14);
}
body{
 background:
  radial-gradient(ellipse at 10% 8%,rgba(77,242,192,.07),transparent 30%),
  radial-gradient(ellipse at 90% 88%,rgba(110,200,255,.07),transparent 34%),
  var(--ink);
}
button{

 {t:'2. Tempelkan atom',p:'Tarik satu hidrogen sampai dekat oksigen, lalu lepas. Ulangi dengan hidrogen kedua. Geser di ruang kosong untuk memutar kamera.',done:()=>cur&&cur.sat&&bonds.length>=2&&cur.key==='H2O',help:()=>build('H2O')},
 {t:'3. Rumus dan nama',sel:'#hud',p:'Di sini muncul rumus dan nama molekulmu. H₂O artinya air (Water).',nx:'Lanjut'},
 {t:'4. Hatch!',sel:'#hatch',p:'Molekul yang lengkap bisa menetas jadi makhluk. Tekan Hatch.',done:()=>alive,help:()=>$('hatch').click()},
 {t:'5. Zoo',sel:'#rail',p:'Makhluk yang menetas tinggal di Zoo, di sisi kiri layar. Ketuk satu untuk melihat kartunya, dan tekan "Bangun lagi" untuk merakitnya ulang. Zoo adalah koleksimu.',nx:'Lanjut'},
 {t:'6. Panaskan',sel:'#bar',p:'Tekan Run, lalu geser Heat ke kanan. Heat adalah suhu simulasi: atom bergetar dan berpijar, ikatan memerah, dan pada suhu tinggi ikatan yang lemah putus sehingga molekul terurai.',done:()=>running,help:()=>$('run').click()},
 {t:'7. Semua 118 elemen',sel:'#ptb',p:'Tabel Periodik berisi seluruh elemen, dikelompokkan per keluarga. Tekan untuk membuka lacinya.',pre:()=>{if(running)$('run').click()},done:()=>!$('rack').hidden,help:()=>openRack(true)},
 {t:'8. Katalog molekul',sel:'#ctb',p:'Ada 155 molekul yang bisa disusun otomatis. Tekan Katalog untuk melihatnya.',pre:()=>openRack(false),done:()=>!$('cat').hidden,help:()=>openCat(true)},
 {t:'9. Quiz Molekul',sel:'#vb',p:'Kuis pilihan ganda A sampai E tentang molekul, dengan waktu 1 menit 30 detik atau tanpa waktu. Coba nanti setelah tutorial.',pre:()=>openCat(false),nx:'Mengerti'},
 {t:'Selesai!',p:'Itu semua yang perlu kamu tahu. Bangku kosong siap kamu pakai. Tombol ? di bawah memutar tutorial ini lagi.',nx:'Mulai bermain'}];
let ti=-1,tint=null;
function tmark(v){try{localStorage.setItem('mztut',v)}catch(e){}}
function tend(v){clearInterval(tint);$('tut').hidden=true;tmark(v);openRack(false);openCat(false);if(v==='skip')startPlay();else{clearAll();tip('Bangku siap. Pilih atom di rak, atau buka Katalog untuk contoh.')}}
function tpos(s){const sp=$('sp'),tc=$('tc');let top=false;
 const el=s.sel&&document.querySelector(s.sel);
 if(el&&!el.hidden){const r=el.getBoundingClientRect();sp.style.display='';sp.style.left=r.left-6+'px';sp.style.top=r.top-6+'px';sp.style.width=r.width+12+'px';sp.style.height=r.height+12+'px';top=r.top+r.height/2>innerHeight*.5}
 else if(s.sel){sp.style.display='none'}
 else{sp.style.display=s.done?'none':'';sp.style.left='50%';sp.style.top='45%';sp.style.width='0';sp.style.height='0';top=!!s.done}
 if(top){tc.style.top='calc(12px + env(safe-area-inset-top,0px))';tc.style.bottom='auto'}else{tc.style.bottom='calc(12px + env(safe-area-inset-bottom,0px))';tc.style.top='auto'}}
function tshow(i){clearInterval(tint);ti=i;const s=TS[i];$('tut').hidden=false;$('ts').textContent=(i+1)+' / '+TS.length;$('tt').textContent=s.t;$('tp').textContent=s.p;
 if(s.pre)s.pre();$('tnx').hidden=!!s.done;$('tnx').textContent=s.nx||'Lanjut';$('thp').hidden=!s.help;$('tsk').hidden=i===TS.length-1;let ok=false;
 const go=()=>{tpos(s);if(s.done&&!ok&&s.done()){ok=true;clearInterval(tint);$('tt').innerHTML=s.t+' <i class="fa-solid fa-circle-check"></i>';setTimeout(()=>tshow(i+1),900)}};go();tint=setInterval(go,300)}
$('tnx').onclick=()=>{if(ti>=TS.length-1)tend('done');else tshow(ti+1)};
$('tsk').onclick=()=>tend('skip');$('thp').onclick=()=>{TS[ti].help()};
$('hb').onclick=()=>{openRack(false);openCat(false);$('vial').hidden=true;tshow(0)};
addEventListener('resize',()=>{if(ti>=0&&!$('tut').hidden)tpos(TS[ti])});
let TUT=null;try{TUT=localStorage.getItem('mztut')}catch(e){}
setTimeout(()=>{$('hero').style.opacity=0;setTimeout(()=>{$('hero').hidden=true},400);if(TUT)startPlay();else tshow(0)},TUT?1600:3500);
// hero molecule
const o0=addAtom('O',new THREE.Vector3(0,0,0)),h1=addAtom('H',new THREE.Vector3(.7,.5,0)),h2=addAtom('H',new THREE.Vector3(-.7,.5,0));mkBond(o0,h1);mkBond(o0,h2);refresh();renderZoo();
function tick(t){requestAnimationFrame(tick);if(!P.size&&!calm)th+=.0018;
 physics();updBonds();glow();
 cam.position.set(rad*Math.sin(ph)*Math.sin(th),rad*Math.cos(ph),rad*Math.sin(ph)*Math.cos(th));cam.lookAt(0,0,0);
 const bl=(t%3500)<120;eyes.forEach(g=>{g.lookAt(cam.position);(g.userData.eg||g).scale.y=bl?.1:1});
 if(!calm)dust.rotation.y+=.0004;R.render(S,cam)}
requestAnimationFrame(tick);
})();
</script>
